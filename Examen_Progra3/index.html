<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGT Hospital - UMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reset y Fondo Base Holográfico Oscuro */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        
        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%);
            min-height: 100vh; 
            display: flex;
            flex-direction: column; 
            align-items: center;
            padding: 60px 20px;
            color: #f8fafc;
        }

        /* Efecto Glassmorphism (Vidrio Esmerilado Premium) */
        .card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            margin-bottom: 30px; 
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card h2 { 
            text-align: center; 
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px; 
            font-weight: 700; 
            font-size: 24px; 
            letter-spacing: -0.5px;
        }

        .form-group { margin-bottom: 20px; }
        
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            color: #94a3b8; 
            font-size: 13px; 
            font-weight: 500; 
            letter-spacing: 0.5px;
        }

        /* Inputs Estilo Cyberpunk Minimalista */
        .form-group input { 
            width: 100%; 
            padding: 14px 16px; 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 14px; 
            font-size: 14px; 
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #818cf8;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.15);
        }

        .form-group input::placeholder { color: #475569; }
        
        /* Botones con Gradientes y Sombra con Brillo */
        .btn-action {
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); 
            color: white;
            border: none; 
            border-radius: 14px;
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        
        .btn-action:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.45);
        }
        .btn-action:active { transform: translateY(0); }
        
        /* Variaciones de botones Aesthetic */
        .btn-verde { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-verde:hover { box-shadow: 0 8px 25px rgba(16, 185, 129, 0.45); }
        
        .btn-azul { 
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); 
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
            margin-bottom: 20px;
        }
        .btn-azul:hover { box-shadow: 0 8px 25px rgba(6, 182, 212, 0.45); }

        /* Esconder secciones dinámicas */
        #chatSection, #viewSection { display: none; }

        /* Contenedor del Chat Limpio */
        #cajaChat {
            height: 320px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 18px;
            padding: 20px;
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom Scrollbar Aesthetic */
        #cajaChat::-webkit-scrollbar { width: 6px; }
        #cajaChat::-webkit-scrollbar-track { background: transparent; }
        #cajaChat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* Burbujas Minimalistas del Chat */
        .burbuja {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 18px 18px 18px 4px;
            max-width: 80%;
            align-self: flex-start;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            animation: pop 0.3s ease;
        }

        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Mis burbujas cambian a degradado morado/índigo */
        .burbuja-mia {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            color: white;
            border-radius: 18px 18px 4px 18px;
            align-self: flex-end; 
        }

        .emisor { 
            font-size: 11px; 
            font-weight: 700; 
            color: #818cf8; 
            margin-bottom: 4px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .burbuja-mia .emisor { color: #c7d2fe; }
        
        .texto-mensaje { font-size: 14px; line-height: 1.4; color: #e2e8f0; }
        .burbuja-mia .texto-mensaje { color: #ffffff; }
    </style>
</head>
<body>

    <div class="card" id="loginSection">
        <h2>Acceso al Portal</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="usernameInput">ID USUARIO</label>
                <input type="text" id="usernameInput" placeholder="Ej: oaranam3" required>
            </div>
            <div class="form-group">
                <label for="passwordInput">CONTRASEÑA</label>
                <input type="password" id="passwordInput" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-action">Ingresar al Sistema</button>
        </form>
    </div>

    <div class="card" id="chatSection">
        <h2>Enviar Mensaje</h2>
        <form id="mensajeForm">
            <div class="form-group">
                <label for="mensajeInput">TU MENSAJE</label>
                <input type="text" id="mensajeInput" placeholder="Escribe algo aesthetic aquí..." required>
            </div>
            <button type="submit" class="btn-action btn-verde">Transmitir Datos</button>
        </form>
    </div>

    <div class="card" id="viewSection">
        <h2>Historial Global</h2>
        <button id="btnCargarMensajes" class="btn-action btn-azul">Refrescar Consola</button>
        
        <div id="cajaChat">
            <div style="text-align: center; color: #475569; font-size: 13px; margin-top: 20px;">
                Sincronizando feed de datos...
            </div>
        </div>
    </div>

    <script>
        // --- SERIE I: LOGIC ---
        document.getElementById('loginForm').addEventListener('submit', async function(evento) {
            evento.preventDefault(); 
            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;
            
            try {
                const response = await fetch('https://backcvbgtmdesa.azurewebsites.net/api/login/authenticate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ "Username": username, "Password": password })
                });

                if (response.ok) {
                    const data = await response.json();
                    let tokenObtenido = typeof data === 'string' ? data : (data.token || data.Token);
                    
                    localStorage.setItem('miToken', tokenObtenido);
                    localStorage.setItem('miUsuario', username);
                    
                    alert("¡Sesión Iniciada de forma segura!");
                    
                    // TRANSICIÓN SÚPER LIMPIA: Desaparece login y aparecen los chats
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('chatSection').style.display = 'block';
                    document.getElementById('viewSection').style.display = 'block';
                    
                    document.getElementById('btnCargarMensajes').click();

                } else {
                    alert("Acceso denegado. Revisa tus credenciales.");
                }
            } catch (error) { console.error(error); }
        });

        // --- SERIE II: LOGIC ---
        document.getElementById('mensajeForm').addEventListener('submit', async function(evento) {
            evento.preventDefault();
            const contenido = document.getElementById('mensajeInput').value;
            const token = localStorage.getItem('miToken');
            const usuarioLogueado = localStorage.getItem('miUsuario');

            try {
                const response = await fetch('https://backcvbgtmdesa.azurewebsites.net/api/Mensajes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ "Cod_Sala": 0, "Login_Emisor": usuarioLogueado, "Contenido": contenido })
                });

                if (response.ok) {
                    document.getElementById('mensajeInput').value = ''; 
                    document.getElementById('btnCargarMensajes').click(); // Auto refrescar al enviar
                } else { alert("Error en la transmisión."); }
            } catch (error) { console.error(error); }
        });

        // --- SERIE III: LOGIC ---
        document.getElementById('btnCargarMensajes').addEventListener('click', async function() {
            const urlMensajes = 'https://examenfinalprogra319328.azurewebsites.net/api/mensajes';
            const token = localStorage.getItem('miToken');
            const miUsuario = localStorage.getItem('miUsuario');
            
            try {
                const response = await fetch(urlMensajes, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const mensajes = await response.json();
                    const cajaChat = document.getElementById('cajaChat');
                    cajaChat.innerHTML = ''; 

                    mensajes.forEach(msg => {
                        const burbuja = document.createElement('div');
                        burbuja.classList.add('burbuja');
                        
                        const emisor = msg.login_Emisor || msg.Login_Emisor || msg.emisor || 'Usuario';
                        const contenido = msg.contenido || msg.Contenido || msg.mensaje || '';

                        if (emisor === miUsuario) {
                            burbuja.classList.add('burbuja-mia');
                        }

                        burbuja.innerHTML = `
                            <div class="emisor">${emisor}</div>
                            <div class="texto-mensaje">${contenido}</div>
                        `;
                        cajaChat.appendChild(burbuja);
                    });

                    cajaChat.scrollTop = cajaChat.scrollHeight; // Scroll suave automático al final
                }
            } catch (error) { console.error(error); }
        });
    </script>
</body>
</html>
